<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="description" content="OmniChat">
<link rel="manifest" href="/manifest.json">
<title>OmniChat</title>
<style>
:root{--bg:#0b0b0f;--panel:#121219;--panel2:#191923;--line:#292936;--text:#f4f4f7;--muted:#a4a4b2;--accent:#8b7cff;--danger:#ff5f6d}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#0d0d12;position:relative;z-index:5}
.brand{font-weight:800;font-size:18px}.brand small{font-size:11px;color:var(--muted);font-weight:500;margin-left:6px}
.top-actions{display:flex;gap:6px}.icon{width:38px;height:38px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px}
.layout{flex:1;min-height:0;display:flex}.side{width:280px;border-right:1px solid var(--line);background:#0f0f15;padding:12px;display:none;flex-direction:column;gap:10px}
@media(min-width:800px){.side{display:flex}}
.side-title{font-size:13px;color:var(--muted);font-weight:700}.new{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text)}
.chats{overflow:auto;display:flex;flex-direction:column;gap:5px}.chat-row{display:flex;align-items:center;gap:4px}.chat-open{flex:1;text-align:left;border:0;background:transparent;color:var(--text);padding:9px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-open.active,.chat-open:hover{background:var(--panel2)}.chat-del{border:0;background:transparent;color:var(--muted);padding:7px}.chat-del:hover{color:var(--danger)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.toolbar{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}.mode{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:9px}.status{font-size:12px;color:var(--muted);margin-left:auto}
.messages{flex:1;overflow:auto;padding:18px 14px 28px;display:flex;flex-direction:column;gap:14px}.empty{margin:auto;text-align:center;max-width:520px;color:var(--muted)}.empty h1{color:var(--text);font-size:30px;margin:0 0 8px}.empty p{margin:0 0 18px}.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.quick button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 12px;border-radius:999px}
.msg{max-width:850px;width:fit-content;min-width:70px;padding:11px 13px;border-radius:14px;line-height:1.55;word-break:break-word}.user{align-self:flex-end;background:#26233b}.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg pre{overflow:auto;background:#08080c;border:1px solid var(--line);padding:12px;border-radius:10px}.msg code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.msg img.generated{display:block;max-width:min(100%,620px);border-radius:10px;margin-top:8px}.file-card{border:1px solid var(--line);background:#101017;border-radius:10px;padding:9px;margin-top:8px}.file-card strong{display:block}.file-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.file-actions button,.download{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:7px 9px;border-radius:8px}
.composer{border-top:1px solid var(--line);padding:10px;background:#0d0d12}.attach-list{display:flex;gap:6px;overflow:auto;margin-bottom:7px}.attach-chip{background:var(--panel2);border:1px solid var(--line);padding:6px 9px;border-radius:9px;font-size:12px;white-space:nowrap}
.input-row{display:flex;gap:7px;align-items:flex-end}.input{flex:1;min-height:44px;max-height:150px;resize:none;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px}.send{height:44px;width:48px;border:0;border-radius:12px;background:var(--accent);color:white;font-weight:800}.tools{display:flex;gap:6px;margin-top:7px}.tools button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 9px;border-radius:8px;font-size:12px}.tools button:hover{color:var(--text)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#22222c;color:var(--text);border:1px solid var(--line);padding:9px 13px;border-radius:10px;display:none;z-index:20;max-width:90%}
.hidden{display:none!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/docx@9.5.1/build/index.umd.js"></script>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">OmniChat <small>open-model AI</small></div>
  <div class="top-actions">
    <button class="icon" id="mobileHistoryBtn" type="button" title="Chats">☰</button>
    <button class="icon" id="newChatBtn" type="button" title="New chat">＋</button>
  </div>
</header>
<div class="layout">
  <aside class="side" id="sidebar">
    <div class="side-title">Chats</div>
    <button class="new" id="newChatSideBtn" type="button">＋ New chat</button>
    <div class="chats" id="chatList"></div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <select class="mode" id="modeSelect" aria-label="Mode">
        <option value="direct">😏 Direct</option><option value="general">🟢 General</option><option value="reasoning">🧠 Reasoning</option><option value="coding">💻 Coding</option><option value="creative">✍️ Creative</option>
      </select>
      <span class="status" id="status">Ready</span>
    </div>
    <section class="messages" id="messages"></section>
    <footer class="composer">
      <div class="attach-list" id="attachList"></div>
      <div class="input-row">
        <button class="icon" id="attachBtn" type="button" title="Attach file">📎</button>
        <textarea class="input" id="promptInput" rows="1" placeholder="Message OmniChat…"></textarea>
        <button class="send" id="sendBtn" type="button">↑</button>
      </div>
      <div class="tools">
        <button id="imageBtn" type="button">🎨 Generate image</button>
        <button id="exportMdBtn" type="button">Export MD</button>
        <button id="exportTxtBtn" type="button">Export TXT</button>
        <button id="exportJsonBtn" type="button">Export JSON</button>
      </div>
      <input id="fileInput" class="hidden" type="file" multiple accept=".pdf,.docx,.odt,.txt,.md,.csv,.json,.html,.htm,.xml,.xlsx,.xls,.ods,.png,.jpg,.jpeg,.webp,.gif,.bmp,.svg">
    </footer>
  </main>
</div>
<div class="toast" id="toast"></div>
</div>
<script>
(() => {
"use strict";

const $ = (id) => document.getElementById(id);
const els = {
  messages:$("messages"), input:$("promptInput"), send:$("sendBtn"), attach:$("attachBtn"),
  fileInput:$("fileInput"), attachList:$("attachList"), image:$("imageBtn"),
  mode:$("modeSelect"), status:$("status"), chatList:$("chatList"),
  newChat:$("newChatBtn"), newChatSide:$("newChatSideBtn"), mobileHistory:$("mobileHistoryBtn"),
  sidebar:$("sidebar"), toast:$("toast"), exportMd:$("exportMdBtn"), exportTxt:$("exportTxtBtn"), exportJson:$("exportJsonBtn")
};

const KEY = "omnichat_v8_chats";
const OLD_KEYS = ["omnichat_chats","omnichat_history","omnichat_recent"];
let chats = loadChats();
let activeId = chats[0]?.id || createChat("New chat");
let attachments = [];
let busy = false;

function uid(){ return "c_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function createChat(title="New chat"){
  const c={id:uid(),title,mode:"direct",messages:[],created:Date.now(),updated:Date.now()};
  chats.unshift(c); activeId=c.id; saveChats(); renderAll(); return c;
}
function activeChat(){ return chats.find(c=>c.id===activeId); }
function loadChats(){
  try{
    let raw=localStorage.getItem(KEY);
    if(raw){ const a=JSON.parse(raw); if(Array.isArray(a)&&a.length) return a; }
    for(const k of OLD_KEYS){
      raw=localStorage.getItem(k);
      if(raw){
        const old=JSON.parse(raw);
        if(Array.isArray(old)&&old.length){
          const msgs=old.flatMap(x=>x.messages||[]).filter(Boolean);
          if(msgs.length) return [{id:uid(),title:"Imported chat",mode:"direct",messages:msgs,created:Date.now(),updated:Date.now()}];
        }
      }
    }
  }catch(e){}
  return [{id:uid(),title:"New chat",mode:"direct",messages:[],created:Date.now(),updated:Date.now()}];
}
function saveChats(){ try{localStorage.setItem(KEY,JSON.stringify(chats.slice(0,50)));}catch(e){toast("Could not save chat history.");} }
function setStatus(s){els.status.textContent=s;}
function toast(s){els.toast.textContent=s;els.toast.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>els.toast.style.display="none",2600);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function renderMarkdown(s){
  if(window.marked && typeof marked.parse==="function"){
    try{return marked.parse(s,{breaks:true,gfm:true});}catch(e){}
  }
  return escapeHtml(s).replace(/\n/g,"<br>");
}
function renderAll(){
  renderSidebar(); renderMessages(); renderAttachments();
}
function renderSidebar(){
  els.chatList.innerHTML="";
  chats.forEach(c=>{
    const row=document.createElement("div");row.className="chat-row";
    const b=document.createElement("button");b.type="button";b.className="chat-open"+(c.id===activeId?" active":"");b.textContent=c.title||"New chat";
    b.addEventListener("click",()=>{activeId=c.id;const x=activeChat();els.mode.value=x.mode||"direct";saveChats();renderAll();});
    const d=document.createElement("button");d.type="button";d.className="chat-del";d.textContent="×";d.title="Delete chat";
    d.addEventListener("click",e=>{e.stopPropagation();deleteChat(c.id);});
    row.append(b,d);els.chatList.appendChild(row);
  });
}
function deleteChat(id){
  chats=chats.filter(c=>c.id!==id);
  if(!chats.length) createChat();
  else {if(activeId===id) activeId=chats[0].id;saveChats();renderAll();}
}
function renderMessages(){
  const c=activeChat(); els.messages.innerHTML="";
  if(!c || !c.messages.length){
    const d=document.createElement("div");d.className="empty";
    d.innerHTML="<h1>OmniChat</h1><p>Chat, code, understand files, generate images and export your work.</p>";
    const q=document.createElement("div");q.className="quick";
    [["Weird fact","Tell me a weird but true fact."],["Roast an idea","Roast this idea constructively: "],["Code","Write a small Python program that explains recursion."],["Explain","Explain a difficult concept simply."]].forEach(([label,text])=>{
      const b=document.createElement("button");b.type="button";b.textContent=label;b.addEventListener("click",()=>{els.input.value=text;els.input.focus();});
      q.appendChild(b);
    });d.appendChild(q);els.messages.appendChild(d);return;
  }
  c.messages.forEach((m,i)=>appendMessage(m,i));
  els.messages.scrollTop=els.messages.scrollHeight;
}
function appendMessage(m,index){
  const d=document.createElement("div");d.className="msg "+(m.role==="user"?"user":"assistant");
  if(m.kind==="image" && m.dataUrl){
    d.innerHTML="<div>"+escapeHtml(m.prompt||"Generated image")+"</div>";
    const img=document.createElement("img");img.className="generated";img.src=m.dataUrl;img.alt=m.prompt||"Generated image";
    d.appendChild(img);
    const bar=document.createElement("div");bar.className="file-actions";
    const b=document.createElement("button");b.type="button";b.textContent="Download image";b.addEventListener("click",()=>downloadDataUrl(m.dataUrl,"omnichat-image.jpg"));
    bar.appendChild(b);d.appendChild(bar);
  }else{
    d.innerHTML=renderMarkdown(m.content||"");
    if(m.role==="assistant"){
      const bar=document.createElement("div");bar.className="file-actions";
      [["MD","md"],["TXT","txt"],["PDF","pdf"],["DOCX","docx"]].forEach(([label,ext])=>{
        const b=document.createElement("button");b.type="button";b.textContent="↓ "+label;b.addEventListener("click",()=>exportText(m.content||"",ext,"response"));
        bar.appendChild(b);
      });d.appendChild(bar);
    }
  }
  els.messages.appendChild(d);
}
function renderAttachments(){
  els.attachList.innerHTML="";
  attachments.forEach((f,i)=>{
    const c=document.createElement("div");c.className="attach-chip";c.textContent=f.name+" · "+formatBytes(f.size)+" ×";
    c.title="Remove attachment";c.addEventListener("click",()=>{attachments.splice(i,1);renderAttachments();});els.attachList.appendChild(c);
  });
}
function formatBytes(n){return n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB";}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function downloadDataUrl(url,name){const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();}
function plainText(markdown){return markdown.replace(/```[\s\S]*?```/g,m=>m.replace(/^```[^\n]*\n?/,"").replace(/```$/,"")).replace(/[#*_>`]/g,"").replace(/\[(.*?)\]\(.*?\)/g,"$1");}

async function exportText(text,ext,prefix="omnichat"){
  try{
    const safe=plainText(text);
    if(ext==="md") downloadBlob(new Blob([text],{type:"text/markdown"}),prefix+".md");
    else if(ext==="txt") downloadBlob(new Blob([safe],{type:"text/plain"}),prefix+".txt");
    else if(ext==="html") downloadBlob(new Blob(["<!doctype html><html><body>"+renderMarkdown(text)+"</body></html>"],{type:"text/html"}),prefix+".html");
    else if(ext==="pdf") await makePdf(safe,prefix+".pdf");
    else if(ext==="docx") await makeDocx(safe,prefix+".docx");
  }catch(e){toast("Export failed: "+e.message);}
}
async function makePdf(text,name){
  if(!window.jspdf?.jsPDF) throw new Error("PDF library unavailable. Check your internet connection.");
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:"pt",format:"a4"});
  const margin=42,width=pdf.internal.pageSize.getWidth()-84;
  let y=54;
  const lines=pdf.splitTextToSize(text||"",width);
  pdf.setFont("helvetica","normal");pdf.setFontSize(11);
  for(const line of lines){if(y>790){pdf.addPage();y=54;}pdf.text(line,margin,y);y+=16;}
  pdf.save(name);
}
async function makeDocx(text,name){
  if(!window.docx) throw new Error("DOCX library unavailable. Check your internet connection.");
  const {Document,Packer,Paragraph}=window.docx;
  const children=(text||"").split(/\n+/).map(line=>new Paragraph({text:line||" "}));
  const doc=new Document({sections:[{properties:{},children}]});
  const blob=await Packer.toBlob(doc);downloadBlob(blob,name);
}
async function uploadConvert(file){
  const fd=new FormData();fd.append("file",file,file.name);
  const r=await fetch("/api/convert",{method:"POST",body:fd});
  const data=await r.json();if(!r.ok)throw new Error(data.error||"Conversion failed");
  return data;
}
function buildPromptWithFiles(text,fileResults){
  if(!fileResults.length)return text;
  return `${text||"Analyze the attached file(s)."}\n\nATTACHED FILE CONTENT:\n${fileResults.map(x=>"--- "+x.name+" ---\n"+x.markdown).join("\n\n")}`;
}
async function send(){
  if(busy)return;
  let text=els.input.value.trim();
  if(!text && !attachments.length)return;
  busy=true;els.send.disabled=true;setStatus("Working…");
  const c=activeChat();const selectedFiles=[...attachments];attachments=[];renderAttachments();
  try{
    const converted=[];
    for(const f of selectedFiles){setStatus("Reading "+f.name+"…");converted.push(await uploadConvert(f));}
    const content=buildPromptWithFiles(text,converted);
    c.messages.push({role:"user",content});
    if(c.messages.length===1)c.title=(text||selectedFiles[0]?.name||"New chat").slice(0,45);
    els.input.value="";saveChats();renderAll();
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:c.mode||"direct",messages:c.messages.slice(-40)})});
    const data=await r.json();if(!r.ok)throw new Error(data.error||"Chat failed");
    c.messages.push({role:"assistant",content:data.answer});c.updated=Date.now();saveChats();renderAll();
  }catch(e){
    c.messages.push({role:"assistant",content:"**Error:** "+e.message});saveChats();renderAll();toast(e.message);
  }finally{busy=false;els.send.disabled=false;setStatus("Ready");}
}
async function generateImage(){
  if(busy)return;
  const prompt=els.input.value.trim();
  if(!prompt){toast("Write an image prompt first.");els.input.focus();return;}
  busy=true;els.image.disabled=true;setStatus("Generating image…");
  try{
    const r=await fetch("/api/image",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
    const data=await r.json();if(!r.ok)throw new Error(data.error||"Image generation failed");
    const c=activeChat();c.messages.push({role:"assistant",kind:"image",prompt,dataUrl:data.dataUrl});c.updated=Date.now();saveChats();els.input.value="";renderAll();
  }catch(e){toast(e.message);}
  finally{busy=false;els.image.disabled=false;setStatus("Ready");}
}
function exportChat(ext){
  const c=activeChat();if(!c?.messages.length){toast("Nothing to export.");return;}
  const text=c.messages.map(m=>m.kind==="image"?"[Generated image: "+m.prompt+"]":(m.role==="user"?"USER:\n":"ASSISTANT:\n")+(m.content||"")).join("\n\n");
  if(ext==="json")downloadBlob(new Blob([JSON.stringify(c,null,2)],{type:"application/json"}),safeName(c.title)+".json");
  else exportText(text,ext,safeName(c.title));
}
function safeName(s){return (s||"omnichat").replace(/[^a-z0-9-_]+/gi,"-").replace(/^-|-$/g,"").slice(0,50)||"omnichat";}

els.send.addEventListener("click",send);
els.input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
els.attach.addEventListener("click",()=>els.fileInput.click());
els.fileInput.addEventListener("change",e=>{attachments=[...attachments,...Array.from(e.target.files||[])];renderAttachments();e.target.value="";});
els.image.addEventListener("click",generateImage);
els.mode.addEventListener("change",()=>{const c=activeChat();c.mode=els.mode.value;saveChats();});
els.newChat.addEventListener("click",()=>createChat());
els.newChatSide.addEventListener("click",()=>createChat());
els.mobileHistory.addEventListener("click",()=>{if(window.innerWidth<800){els.sidebar.style.display=els.sidebar.style.display==="flex"?"none":"flex";}});
els.exportMd.addEventListener("click",()=>exportChat("md"));
els.exportTxt.addEventListener("click",()=>exportChat("txt"));
els.exportJson.addEventListener("click",()=>exportChat("json"));

renderAll();
els.mode.value=activeChat()?.mode||"direct";
})();
</script>
</body>
</html>
