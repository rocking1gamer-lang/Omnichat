<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f"><link rel="manifest" href="/manifest.json"><title>OmniChat</title>
<style>
:root{--bg:#0b0b0f;--panel:#121219;--panel2:#191923;--line:#292936;--text:#f4f4f7;--muted:#a4a4b2;--accent:#8b7cff;--user:#26233b}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,textarea,input{font:inherit}button{cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}.top{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#0d0d12}.brand{font-weight:800;font-size:20px}.brand small{font-size:11px;color:var(--muted);font-weight:500;margin-left:6px}.top-actions{display:flex;gap:6px}.icon{width:42px;height:42px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px}
.layout{flex:1;min-height:0;display:flex}.side{width:280px;border-right:1px solid var(--line);background:#0f0f15;padding:12px;display:none;flex-direction:column;gap:10px}@media(min-width:800px){.side{display:flex}}
.side-title{color:var(--muted);font-size:13px;font-weight:700}.new{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text)}.chats{overflow:auto;display:flex;flex-direction:column;gap:5px}.chat-row{display:flex;gap:4px}.chat-open{flex:1;text-align:left;border:0;background:transparent;color:var(--text);padding:9px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-open.active,.chat-open:hover{background:var(--panel2)}.chat-del{border:0;background:transparent;color:var(--muted);padding:7px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.status{height:34px;padding:7px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;text-align:right}.messages{flex:1;overflow:auto;padding:18px 14px 28px;display:flex;flex-direction:column;gap:14px}.empty{margin:auto;text-align:center;color:var(--muted);max-width:680px}.empty h1{color:var(--text)}.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.quick button,.tool{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 12px;border-radius:999px}
.msg{max-width:900px;width:fit-content;min-width:70px;padding:11px 13px;border-radius:14px;line-height:1.55;word-break:break-word}.user{align-self:flex-end;background:var(--user)}.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}pre{overflow:auto;background:#08080c;border:1px solid var(--line);padding:12px;border-radius:10px}code{font-family:ui-monospace,Consolas,monospace}.msg img{max-width:min(100%,680px);border-radius:10px;display:block}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.actions button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:7px 10px;border-radius:8px}.file{border:1px solid var(--line);padding:10px;border-radius:10px;background:#101017}.composer{border-top:1px solid var(--line);padding:10px;background:#0d0d12}.attach-list{display:flex;gap:6px;overflow:auto;margin-bottom:7px}.chip{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:6px 9px;border-radius:9px;white-space:nowrap}.row{display:flex;gap:7px;align-items:flex-end}.input{flex:1;min-height:46px;max-height:150px;resize:none;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px}.send{height:46px;width:50px;border:0;border-radius:12px;background:var(--accent);color:white;font-weight:800}.tools{display:flex;gap:6px;margin-top:7px;overflow:auto}.tools .tool{border-radius:9px;white-space:nowrap;color:var(--muted)}.tools .tool:hover{color:var(--text)}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#22222c;color:var(--text);border:1px solid var(--line);padding:9px 13px;border-radius:10px;display:none;z-index:50;max-width:90%;text-align:center}.hidden{display:none!important}.searchbar{display:none;border-bottom:1px solid var(--line);padding:8px;gap:6px}.searchbar input{flex:1;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}.searchbar button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}.source{padding:8px 0;border-bottom:1px solid var(--line)}.source a{color:#a99cff}
</style></head>
<body><div class="app">
<header class="top"><div class="brand">OmniChat <small>open-model AI</small></div><div class="top-actions"><button class="icon" id="historyBtn" type="button">☰</button><button class="icon" id="newBtn" type="button">＋</button></div></header>
<div class="layout"><aside class="side" id="side"><div class="side-title">Chats</div><button class="new" id="newSide" type="button">＋ New chat</button><div class="chats" id="chatList"></div></aside>
<main class="main"><div class="status" id="status">Ready</div><div class="searchbar" id="searchbar"><input id="searchInput" placeholder="Search the web…"><button id="searchBtn" type="button">Search</button></div><div class="messages" id="messages"></div>
<div class="composer"><div class="attach-list" id="attachments"></div><div class="row"><textarea class="input" id="input" placeholder="Message OmniChat…" rows="1"></textarea><button class="send" id="sendBtn" type="button">↑</button></div>
<div class="tools"><button class="tool" id="attachBtn" type="button">📎 Attach</button><button class="tool" id="imageBtn" type="button">🎨 Image</button><button class="tool" id="webBtn" type="button">🌐 Web search</button><button class="tool" id="deepBtn" type="button">🔎 Deep Research</button><button class="tool" id="mdBtn" type="button">↓ MD</button><button class="tool" id="txtBtn" type="button">↓ TXT</button><button class="tool" id="jsonBtn" type="button">↓ JSON</button></div>
<input id="fileInput" class="hidden" type="file" multiple accept=".pdf,.doc,.docx,.txt,.md,.csv,.json,.html,.png,.jpg,.jpeg,.webp,.gif">
</div></main></div><div class="toast" id="toast"></div></div>
<script src="/frontend.js" defer></script></body></html>
